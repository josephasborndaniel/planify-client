name: Planify E2E Tests

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  selenium:
    name: Selenium — Website Tests (300)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: Selenium-Test-Report
          path: test-reports/Selenium_Tests.xlsx

  appium:
    name: Appium — Android Tests (300)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: Appium-Test-Report
          path: test-reports/Appium_Tests.xlsx

  unit:
    name: Unit Tests — API (300)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: Unit-Test-Report
          path: test-reports/Unit_Tests.xlsx

  validation:
    name: Validation Tests (300)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: Validation-Test-Report
          path: test-reports/Validation_Tests.xlsx

  vulnerability:
    name: Vulnerability Tests — Security (300)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: Vulnerability-Test-Report
          path: test-reports/Vulnerability_Tests.xlsx

  load:
    name: Load Testing — Performance (300)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: Load-Test-Report
          path: test-reports/Load_Tests.xlsx
