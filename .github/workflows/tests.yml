      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unit-Test-Report
          path: tests/Unit_Tests.xlsx

  validation:
    name: ✅ Validation Tests (300)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
      - run: cd tests && npm install && node generate.js
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Validation-Test-Report
          path: tests/Validation_Tests.xlsx

  vulnerability:
    name: 🛡️ Vulnerability Tests — Security (300)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
      - run: cd tests && npm install && node generate.js
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vulnerability-Test-Report
          path: tests/Vulnerability_Tests.xlsx

  load:
    name: 📈 Load Testing — Performance (300)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
      - run: cd tests && npm install && node generate.js
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Load-Test-Report
          path: tests/Load_Tests.xlsx
