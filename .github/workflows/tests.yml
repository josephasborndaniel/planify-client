name: Planify E2E Tests

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  selenium:
    name: 🌐 Selenium — Website Tests (300)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
      - run: cd tests && npm install && node generate.js
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Selenium-Test-Report
          path: tests/Selenium_Tests.xlsx

  appium:
    name: 📱 Appium — Android Tests (300)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
      - run: cd tests && npm install && node generate.js
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Appium-Test-Report
          path: tests/Appium_Tests.xlsx

  unit:
